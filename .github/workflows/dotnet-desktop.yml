name: Build And Publish Package

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-pack:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install iOS workload
        run: dotnet workload install maui-ios

      - name: Build XCFramework (device + simulator)
        run: ./scripts/build-xcframework.sh

      - name: Restore dependencies
        run: dotnet restore MAUI.StoreKit2/MAUI.StoreKit2.csproj

      - name: Build net9.0-ios
        run: dotnet build MAUI.StoreKit2/MAUI.StoreKit2.csproj -c Release -f net9.0-ios --no-restore

      - name: Build net10.0-ios
        run: dotnet build MAUI.StoreKit2/MAUI.StoreKit2.csproj -c Release -f net10.0-ios --no-restore

      - name: Pack package
        run: >
          dotnet pack MAUI.StoreKit2/MAUI.StoreKit2.csproj
          -c Release
          --no-restore
          -p:TargetFrameworks=net9.0-ios%3Bnet10.0-ios
          -p:PackageOutputPath="${{ github.workspace }}/artifacts"

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ github.workspace }}/artifacts/*

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          shopt -s nullglob
          for package in "${{ github.workspace }}"/artifacts/*.nupkg; do
            if [[ "$package" == *.snupkg ]]; then
              continue
            fi

            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done
